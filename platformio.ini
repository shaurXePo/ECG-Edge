; PlatformIO alternative to the CMake build (Nucleo-F411RE).  NOT TESTED by the author of this repo
; (the CMake build is); see README "PlatformIO" for what to check if it fails.
;
; Differences vs CMake: PlatformIO's CMSIS framework supplies startup code, the linker script and
; system_stm32f4xx.c, so our board/stm32f4/{startup,system}_stm32f4.c and ld/ are NOT compiled.
; Our platform_stm32f4.c / main_stm32f4.c still provide UART, DWT, stack painting and main().
; Prerequisites:  ./scripts/fetch_deps.sh   and   python scripts/export_headers.py
[platformio]
src_dir      = firmware
default_envs = nucleo_f411re

[env:nucleo_f411re]
platform  = ststm32
board     = nucleo_f411re
framework = cmsis
extra_scripts = pre:scripts/pio_extra.py       ; adds the CMSIS-DSP sources we need
build_src_filter =
    -<*>
    +<src/>
    +<board/stm32f4/platform_stm32f4.c>
    +<board/stm32f4/main_stm32f4.c>
build_flags =
    -O2 -g3 -ffunction-sections -fdata-sections
    -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16
    -Ifirmware/inc -Ifirmware/inc/generated -Ifirmware/board/stm32f4
    -Ithird_party/CMSIS-DSP/Include -Ithird_party/CMSIS-DSP/PrivateInclude
    -DSTM32F411xE -DECG_BOARD_NUCLEO_F411RE=1 -DECG_USE_PLL=0 -DECG_PT_MAX_PEAKS=128
    -DECG_UART_BAUD=115200
    -Wl,--gc-sections
monitor_speed = 115200
upload_protocol = stlink
