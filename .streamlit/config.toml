# Theme for the web app (read from the repo root, also on Streamlit Community Cloud).
[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111B2E"
textColor = "#E6EDF7"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
